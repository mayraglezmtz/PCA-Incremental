<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PCA Incremental</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .stats { display: flex; gap: 20px; margin-bottom: 30px; }
    .stat { background: #f0f4ff; border-radius: 8px; padding: 16px 24px; text-align: center; }
    .stat strong { display: block; font-size: 2rem; color: #3b5bdb; }
    .grafica img { max-width: 100%; border-radius: 8px; border: 1px solid #ddd; }
    .sin-grafica { background: #f8f9fa; border-radius: 8px; padding: 40px;
                   text-align: center; color: #868e96; }
  </style>
</head>
<body>
  <h1>PCA Incremental</h1>

  <div class="stats">
    <div class="stat"><strong>{{ total }}</strong>Total de puntos</div>
    <div class="stat"><strong>{{ promovidos }}</strong>Promovidos al PCA</div>
    <div class="stat"><strong>{{ pendientes }}</strong>Pendientes</div>
  </div>

  <h2>Última gráfica generada</h2>
  {% if tiene_grafica %}
    <div class="grafica">
      <img src="/media/pca_plot.png?t={{ request.META.HTTP_HOST }}" alt="Gráfica PCA">
    </div>
  {% else %}
    <div class="sin-grafica">
      <p>Aún no hay gráfica. Se generará automáticamente cuando se entrene el modelo con 20 puntos.</p>
    </div>
  {% endif %}
</body>
</html>
